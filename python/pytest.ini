# ==============================================
# PYTEST CONFIGURATION
# ==============================================
# File Location: Beat-the-Box-Card-Game/python/pytest.ini
# Status: ACTIVE
# Version: 1.1
# Last Updated: 2026-10-20
# Last Tested: 2026-10-20 (pytest: 295 passed, 1 xfailed)
#
# VERSION 1.1 CHANGES (2026-10-20):
# - faulthandler_timeout: a test still running after 60 seconds prints a
#   traceback of every thread (where it is stuck) instead of hanging
#   silently. The run carries on waiting, so Ctrl+C still stops it.
# - addopts = -rs: the summary lists every skipped test with its reason.
#
# VERSION 1.0 CHANGES (2026-10-20):
# - New. Lets pytest find the btb package and the test helpers.
#
# DESCRIPTION:
# -----------
# Tells pytest where the tests are and what to put on the import path, so
# `python -m pytest` works from the python/ folder with no install step.
#   testpaths            - only collect tests from tests/
#   pythonpath           - "." for the btb package, "tests" for helpers/conftest
#   addopts              - -rs: show why each skipped test was skipped
#   faulthandler_timeout - seconds before a stuck test dumps its traceback
#
# NOTES:
# -----
# The slowest test takes about 5 seconds on Linux; 60 leaves plenty of
# room for a slower PC.

[pytest]
testpaths = tests
pythonpath = . tests
addopts = -rs
faulthandler_timeout = 60