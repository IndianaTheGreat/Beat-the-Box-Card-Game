# ==============================================
# PYTEST CONFIGURATION
# ==============================================
# File Location: Beat-the-Box-Card-Game/python/pytest.ini
# Status: ACTIVE
# Version: 1.0
# Last Updated: 2026-10-20
#
# VERSION 1.0 CHANGES (2026-10-20):
# - New. Lets pytest find the btb package and the test helpers.
#
# DESCRIPTION:
# -----------
# Tells pytest where the tests are and what to put on the import path, so
# `pytest` works from the python/ folder with no install step.
#   testpaths  - only collect tests from tests/
#   pythonpath - "." for the btb package, "tests" for helpers/conftest

[pytest]
testpaths = tests
pythonpath = . tests